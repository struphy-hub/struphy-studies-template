# Settings of this studies repository (see the README, "Set up a copy"):
#   site_name: the title of the site;
#   repo_url:  this repository (the study pages link to its study folders; CI checks it);
#   site_url:  only for GitHub Pages (https://<owner>.github.io/<repository>/), else leave it out.
site_name: Struphy studies
repo_url: https://github.com/struphy-hub/struphy-studies-template
repo_name: struphy-studies-template
site_description: Numerical studies with Struphy, with the runs to reproduce them and their figures and videos.
edit_uri: ""
# generated by tools/build_site.py from studies/*/study.yaml
docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/struphy_logo.jpg
  favicon: assets/struphy_logo.jpg
  features:
    - content.code.copy
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

extra_javascript:
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra_css:
  - assets/extra.css

plugins:
  - search
  # OFFLINE=true (python tools/build_site.py --offline): the site opens from disk without a server
  - offline:
      enabled: !ENV [OFFLINE, false]
  - glightbox:
      auto_caption: false
      zoomable: true

markdown_extensions:
  # LaTeX math: $...$ inline, $$...$$ display (rendered by MathJax, see site_assets/mathjax.js)
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
